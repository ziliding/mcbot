services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: uta-mc
    restart: unless-stopped
    environment:
      # You must accept the Minecraft EULA yourself: set MC_EULA=TRUE in .env
      # after reading https://aka.ms/MinecraftEULA
      EULA: ${MC_EULA:-FALSE}
      TYPE: VANILLA
      VERSION: ${MC_VER:-26.1}
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      # Private server: only whitelisted players may join. Add players from the
      # server console (`docker exec uta-mc rcon-cli whitelist add <name>`), NOT
      # via the WHITELIST env var: that resolves names against Mojang and stores
      # premium UUIDs, which never match the offline UUIDs players get here.
      # Offline mode trusts the name, so the port is also bound to 127.0.0.1.
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      MEMORY: 2G
      MOTD: uta companion server
    ports:
      # Offline-mode server: never expose beyond this machine.
      - "127.0.0.1:25565:25565"
    volumes:
      - ./mc-data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3

  mcbot:
    build: .
    container_name: uta-mcbot
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the server is reached by service name.
      MC_HOST: mc
      MC_PORT: "25565"
      # Fixed inside the container; MCP_PORT in .env only changes the host side.
      MCP_PORT: "3333"
      # Matrix homeserver (tuwunel shares the "tailscale" container's network
      # namespace in the matrix compose project).
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-http://tailscale:6167}
    ports:
      # MCP endpoint for Hermes (runs on the host). It can control the bot:
      # localhost only, and every request needs MCP_TOKEN.
      - "127.0.0.1:${MCP_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      mc:
        condition: service_healthy
    networks:
      - default
      - matrix
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  matrix:
    name: matrix_default
    external: true
